<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kuis Huruf - Halaman 1</title>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    :root{
      --black: #000;
      --grey: #8a8a8a;
      --red:  #d32f2f;
      --touch-size: 24pt;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: 'Be Vietnam Pro', sans-serif;
      background:#fff;
      color:var(--black);
      -webkit-tap-highlight-color: transparent;
      text-align: center;
    }

    .wrap{
      max-width:760px;
      margin:18px auto;
      padding:16px;
    }

    h1{
      font-size:1.25rem;
      margin:0 0 12px 0;
    }

    .buttons{
      display:flex;
      justify-content: center;
      gap:12px;
      margin-bottom:20px;
      flex-wrap:wrap;
      text-align: center;
    }

    .letter-btn{
      background:#f4f4f4;
      border:1px solid #ddd;
      border-radius:8px;
      padding:18px 26px;
      font-size:var(--touch-size);
      cursor:pointer;
      user-select:none;
      touch-action:manipulation;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:72px;
    }

    .letter-btn:active{ transform:scale(1.1); }

    .letter {
      font-weight:800;
      font-size: 38pt;
    }

    .letter.black { color: var(--black); }
    .letter.grey  { color: var(--grey); }
    .letter.red   { color: var(--red); }

    .line {
      margin:12px 0;
      font-size: var(--touch-size);
      line-height:1.5;
      word-break:break-word;
      text-align: center;
    }

    .segment{
      margin-right:12px;
      display:inline-block;
      padding:6px 8px;
      border-radius:6px;
    }

    .hint{
      margin-top:18px;
      font-size:0.95rem;
      color:#555;
    }

    .controls{
      margin-top:18px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content: center;
    }

    .btn{
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #ccc;
      background:#fff;
      cursor:pointer;
    }

    .nav-btn {
      background-color: #00aa71ff; 
      color: white; 
      padding: 10px 20px; 
      border: none; 
      border-radius: 5px; 
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Halaman 1 — Mengenal Huruf</h1>

    <div class="buttons">
      <div class="letter-btn" data-type="a" role="button" aria-label="huruf a">
        <span class="letter black">a</span>
      </div>

      <div class="letter-btn" data-type="ba" role="button" aria-label="huruf ba">
        <span class="letter black">ba</span>
      </div>
    </div>

    <div class="line" id="line1">
      <span class="letter black">a</span>&nbsp;&nbsp;&nbsp;<span class="letter grey">a</span>&nbsp;&nbsp;&nbsp;<span class="letter black">ba</span>&nbsp;&nbsp;&nbsp;<span class="letter grey">ba</span>
    </div>

    <div class="line" id="line2">
      <span class="segment"><span class="letter black">a</span><span> &nbsp;&nbsp;&nbsp;</span><span class="letter grey">ba</span></span>&nbsp;
      <span class="letter black">a</span><span class="letter grey">ba</span>
    </div>

    <div class="line" id="line3">
      <span class="letter black">ba</span><span class="letter grey">ba</span>&nbsp;&nbsp;&nbsp;
      <span class="letter black">a</span><span class="letter grey">ba</span>-<span class="letter black">a</span><span class="letter grey">ba</span>
    </div>

    <div class="line" id="line4">
      <span class="letter black">a</span>&nbsp;&nbsp;&nbsp;<span class="letter grey">ba</span>
    </div>

    <div class="controls">
      <button class="btn" id="resetBtn">Reset warna</button>
      <button class="btn" id="toggleSound">Mute / Unmute</button>  
      <button class="nav-btn" onclick="window.location.href='test1.html'">Next</button>
    </div>

    <p class="hint">Sentuh huruf <strong>a</strong> atau <strong>ba</strong> di atas untuk memutar suara.</p>
  </div>

  <script>
    const btnA = document.querySelector('.letter-btn[data-type="a"]');
    const btnBa = document.querySelector('.letter-btn[data-type="ba"]');
    const resetBtn = document.getElementById('resetBtn');
    const toggleSoundBtn = document.getElementById('toggleSound');
    let soundEnabled = true;
    let voices = [];

    // Ambil daftar voice
    function loadVoices() {
      voices = speechSynthesis.getVoices();
    }
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;

    function speakText(text) {
      if (!soundEnabled) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';
      const indoVoice = voices.find(v => v.lang === 'id-ID');
      if (indoVoice) {
        utterance.voice = indoVoice;
      }
      utterance.rate = 0.9; // agak pelan supaya jelas
      speechSynthesis.speak(utterance);
    }

    function setActiveLetter(el) {
      el.classList.remove('black','grey');
      el.classList.add('red');
    }

    btnA.addEventListener('click', ()=> {
      const span = btnA.querySelector('.letter');
      setActiveLetter(span);
      speakText('a');
    });

    btnBa.addEventListener('click', ()=> {
      const span = btnBa.querySelector('.letter');
      setActiveLetter(span);
      speakText('ba');
    });

    document.querySelectorAll('.line .letter').forEach(letterEl => {
      letterEl.style.cursor = 'pointer';
      letterEl.addEventListener('click', ()=>{
        const text = letterEl.textContent.trim().toLowerCase();
        if(text === 'a'){
          setActiveLetter(letterEl);
          speakText('a');
        } else if(text === 'ba'){
          setActiveLetter(letterEl);
          speakText('ba');
        }
      });
    });

    resetBtn.addEventListener('click', ()=>{
      document.querySelectorAll('.letter').forEach(el=>{
        el.classList.remove('red');
        if(el.classList.contains('grey')) {
          el.classList.remove('black','red');
          el.classList.add('grey');
        } else {
          el.classList.remove('grey','red');
          el.classList.add('black');
        }
      });
    });

    toggleSoundBtn.addEventListener('click', ()=>{
      soundEnabled = !soundEnabled;
      toggleSoundBtn.style.opacity = soundEnabled ? '1' : '0.6';
    });

    function bindTouch(el, fn){
      el.addEventListener('touchstart', function(e){
        e.preventDefault();
        fn();
      }, {passive:false});
    }
    bindTouch(btnA, ()=> btnA.click());
    bindTouch(btnBa, ()=> btnBa.click());

    (function initRestore(){
      document.querySelectorAll('.letter').forEach(el=>{
        if(!el.classList.contains('black') && !el.classList.contains('grey') && !el.classList.contains('red')){
          el.classList.add('black');
        }
      });
    })();
  </script>
</body>
</html>
