<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kuis Huruf - Halaman 2</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000;
      --grey: #8a8a8a;
      --red:  #d32f2f;
      --touch-size: 24pt;
    }

    body {
      margin:0;
      font-family: 'Be Vietnam Pro', sans-serif;
      background:#fff;
      color:var(--black);
      text-align:center;
    }

    .wrap { max-width:760px; margin:18px auto; padding:16px; }
    h1 { font-size:1.25rem; margin-bottom:12px; }

    .buttons {
      display:flex; justify-content:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;
    }

    .letter-btn {
      background-color:#e7e9ebff;
      border:1px solid #ddd;
      border-radius:8px;
      padding:18px 26px;
      font-size:var(--touch-size);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:72px;
    }

    .letter-btn:active { transform:scale(1.1); }

    .letter { font-weight:bold; font-size:42pt; }
    .letter.black { color:var(--black); }
    .letter.grey { color:var(--grey); }
    .letter.red { color:var(--red); }

    .line { margin:12px 0; font-size:var(--touch-size); line-height:1.5; }
    .segment { margin-right:12px; display:inline-block; padding:6px 8px; }

    .controls {
      margin-top:18px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .btn {
      padding:10px 14px;
      border-radius:6px;
      border:1px solid #ccc;
      background:#fff;
      cursor:pointer;
    }

    .nav-btn {
      background-color:#00aa71ff;
      color:white;
      padding:10px 20px;
      border:none;
      border-radius:5px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }

    .hint { margin-top:18px; font-size:0.95rem; color:#555; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Halaman 2 — Mengenal Huruf</h1>

    <div class="buttons">
      <div class="letter-btn" data-type="ba"><span class="letter black" data-original="black">ba</span></div>
      <div class="letter-btn" data-type="ca"><span class="letter black" data-original="black">ca</span></div>
    </div>

    <div class="line" id="line1">
      <span class="letter black" data-original="black">ba</span>&nbsp;&nbsp;&nbsp;
      <span class="letter grey" data-original="grey">ca</span>&nbsp;&nbsp;&nbsp;
      <span class="letter black" data-original="black">ba</span><span class="letter grey" data-original="grey">ca</span>
    </div>

    <div class="line" id="line2">
      <span class="segment">
        <span class="letter black" data-original="black">ca</span>
        <span> &nbsp;&nbsp;</span>
        <span class="letter grey" data-original="grey">ba</span>
      </span>&nbsp;
      <span class="letter black" data-original="black">ca</span><span class="letter grey" data-original="grey">ba</span>
    </div>

    <div class="line" id="line3">
      <span class="letter black" data-original="black">ba</span><span class="letter grey" data-original="grey">ca</span>&nbsp;&nbsp;&nbsp;
      <span class="letter black" data-original="black">ca</span><span class="letter grey" data-original="grey">ba</span>&nbsp;&nbsp;&nbsp;
      <span class="letter black" data-original="black">a</span><span class="letter grey" data-original="grey">ca</span>&nbsp;&nbsp;&nbsp;
    </div>

    <div class="line" id="line4">
      <span class="letter black" data-original="black">ba</span><span class="letter grey" data-original="grey">ba</span>&nbsp;&nbsp;&nbsp;
      <span class="letter black" data-original="black">ca</span><span class="letter grey" data-original="grey">ca</span>
    </div>

    <div class="controls">
      <button class="nav-btn" onclick="window.location.href='index.html'">Back</button>
      <button class="btn" id="resetBtn">Warna</button>
      <button class="btn" id="toggleSound">Suara</button>  
      <button class="nav-btn" onclick="window.location.href='test1.html'">Next</button>
    </div>

    <p class="hint">Sentuh huruf untuk mendengarkan suaranya.</p>
  </div>

  <script>
    let soundEnabled = true;
    let synth = window.speechSynthesis;

    function speak(text) {
    if (!soundEnabled || !synth) return;
    let voices = synth.getVoices();

    // kalau belum tersedia, tunggu event onvoiceschanged
    if (!voices.length) {
      window.speechSynthesis.onvoiceschanged = () => speak(text);
      return;
    }
      
    let voice = voices.find(v => v.lang === 'id-ID');
    let utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'id-ID';
    utterance.voice = voice || voices[0]; // fallback kalau ga ada
    utterance.rate = 1;
    utterance.pitch = 1;
      
    synth.cancel();
    synth.speak(utterance);
  }

    window.speechSynthesis.onvoiceschanged = () => {
  console.log(speechSynthesis.getVoices());
};

    function setActiveLetter(el) {
      el.classList.remove('black', 'grey');
      el.classList.add('red');
    }

    document.querySelectorAll('.letter').forEach(letterEl => {
      letterEl.style.cursor = 'pointer';
      letterEl.addEventListener('click', () => {
        setActiveLetter(letterEl);
        speak(letterEl.textContent.trim());
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('.letter').forEach(el => {
        el.classList.remove('red', 'black', 'grey');
        el.classList.add(el.dataset.original);
      });
    });

    document.getElementById('toggleSound').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('toggleSound').style.opacity = soundEnabled ? '1' : '0.6';
    });
  </script>
</body>
</html>
